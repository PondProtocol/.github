name: Feature or change proposal
description: Propose new functionality or a change to how something works
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are welcome. The project is early, so discussing a change here before writing code usually saves everyone time.

        Proposing a change to a **token parameter** in `config/tokens.json`? Use the "Token parameter change" template instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult, missing, or wrong today? Describe the situation rather than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to happen. Sketch the command, API, or file layout if it helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.
    validations:
      required: false

  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - rpnd
        - pnd
        - protocol
        - not sure
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Does this change any of the following?
      description: Tick everything that applies. These need more review.
      options:
        - label: On-ledger behaviour (transactions built or submitted)
        - label: Token metadata (XLS-26 or XLS-89)
        - label: Key or secret handling
        - label: A new runtime dependency

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
