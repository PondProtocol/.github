name: Bug report
description: Something behaves differently than documented or expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Do not file security vulnerabilities here.** Use the [Security Policy](https://github.com/PondProtocol/.github/blob/main/SECURITY.md) instead.

        **Never paste a seed, private key, or the contents of your `.env`.**

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
      placeholder: |
        I ran `issue-rpnd` on Devnet and expected the MPT to be created, but ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, in order.
      render: shell
      placeholder: |
        npm install
        npx tsx src/cli.ts fund
        npx tsx src/cli.ts configure-issuer
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Console output, error message, or transaction result code. Redact addresses if you prefer.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - rpnd
        - pnd
        - protocol
        - not sure
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Leave as "none" for offline commands like `dry-run` or `encode-metadata`.
      options:
        - none (offline)
        - devnet
        - testnet
        - mainnet
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Node version and commit
      description: Output of `node --version`, plus the commit SHA you are on.
      placeholder: "v22.11.0 / b79cada"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report contains no seeds, private keys, or other secrets.
          required: true
